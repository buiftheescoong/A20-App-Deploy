services:
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
      target: dev
    env_file:
      - path: .env.docker
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAW_RAG_DATA_DIR: /app/data/raw
    volumes:
      - ./ai-service:/app/ai-service
      - ./data/raw:/app/data/raw:ro
    ports:
      - "8000:8000"

  api-gateway:
    build:
      context: ./api-gateway
      target: dev
    env_file:
      - path: .env.docker
        required: false
    environment:
      PORT: 3001
      NODE_ENV: development
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:5173
      FRONTEND_ORIGINS: http://localhost:5173
    volumes:
      - ./api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - ai-service

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - path: .env.docker
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:3001
      VITE_USE_MOCK: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  api_gateway_node_modules:
  frontend_node_modules:
